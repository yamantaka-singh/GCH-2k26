[project]
name = "sentinel-registry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.9",
  "python-dotenv>=1.0",
  "bcrypt>=4.2",
  "python-multipart>=0.0.12",
  "numpy>=2.5.3",
  "jsonschema>=4.26.0",
  "opencv-python-headless>=5.0.0.93",
  "ultralytics>=8.4.152",
  "lap>=0.5.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
  # starlette imports a deprecated anyio alias at module scope. Third-party, not
  # fixable here. Scoped to this one message so our own deprecations still surface.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.uv]
package = false
